{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details</title>


    <link rel="stylesheet" href="{% static 'css/style.css' %}">


    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    
</head>
<body id="back">

{% if user.is_superuser %}
    <div class="container">
  
        <div class="text-right" style="margin-bottom: 20px;">
            <button id="coursebutton" type="button" class="btn btn-info btn-lg explicit" data-toggle="modal" data-target="#myModal">
            Edit Course
            </button>
        </div>

        <!-- Modal -->
        <div class="modal fade" id="myModal" role="dialog">
            <div class="modal-dialog">
        
        <form id="modalformidcheck" action="{% url 'coursedetail' course.pk %}" method="POST" enctype="multipart/form-data">
        {% csrf_token %}

            <!-- Modal content-->
            <div class="modal-content">
                
                    <div class="modal-header">

            <button type="button" class="close" data-dismiss="modal">&times;</button>
            <h4 class="modal-title">Edit Course</h4>

                    </div>


            <div class="modal-body">
                <div id="error-box" style="color: red; margin-bottom: 15px;"></div>
                {{form.as_p}}
                
            </div>


            <div class="modal-footer">
              <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
             
              <button type="submit" class="btn btn-success">Save Course</button>
            </div>
          
      </div>
        </form>
    </div>
  </div>
  
</div> <!-- End of Container. Removed the extra rogue </div> -->
{% endif %}


    <div class="detail"> 
        <div class="heading">
            <h1 style="color:rgb(17, 17, 151)">{{course.course_name}}</h1>
            <p>{{course.Subject}}</p>
            <p style="text-align: left;font-size: 15px;">{{course.created_at}}</p>
        </div>

        

        <div class="description">
            <p>{{course.description}}</p>

            <div>
                 <img src="{{course.image.url}}" alt="courses-image" style="width: 200px;height: 150px;">     
            </div>
            </div>
    </div>
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
