{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details</title>


    <link rel="stylesheet" href="{% static 'css/style.css' %}">


    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    
</head>
<body id="back">


    <div class="container">
    <div class="container-fluid">
    
    <div style="display: flex; justify-content:right; align-items: center; background-color: #303131; padding: 15px; border: 1px solid #e7e7e7; border-radius: 5px; margin-bottom: 25px;">
       <div class="text-right" style="margin-bottom: 20px;">
           <a href="{% url 'courseview' %}">
             <button type="button" class="btn btn-info btn-lg explicit" >
            Back
            </button>
           </a>
        </div>
        {% if user.is_superuser %}
        <div class="text-right" style="margin-bottom: 20px;">
            <button id="coursebutton" type="button" class="btn btn-info btn-lg explicit" data-toggle="modal" data-target="#myModal">
            Edit Course
            </button>
        </div>
        {% endif %}
    </div>
</div>
        <!-- Modal -->
        <div class="modal fade" id="myModal" role="dialog">
            <div class="modal-dialog">
        
        <form id="modalformidcheck" action="{% url 'coursedetail' course.pk %}" method="POST" enctype="multipart/form-data">
        {% csrf_token %}

            <!-- Modal content-->
            <div class="modal-content">
                
                    <div class="modal-header">

            <button type="button" class="close" data-dismiss="modal">&times;</button>
            <h4 class="modal-title">Edit Course</h4>

                    </div>


            <div class="modal-body">
                <div id="error-box" style="color: red; margin-bottom: 15px;"></div>
                {{form.as_p}}
                
            </div>


            <div class="modal-footer">
              <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
             
              <button type="submit" class="btn btn-success">Save Course</button>
            </div>
          
      </div>
        </form>
    </div>
  </div>
  
</div> <!-- End of Container. Removed the extra rogue </div> -->



    <div class="detail"> 
        <div class="heading">
           <div class="coursediv">
             <h1 class="courseheading">{{course.course_name}}</h1>
            
            <p style="text-align: left;font-size: 15px;">{{course.created_at}}</p>
           </div>
        </div>

        

        <div class="description">
            <h2 style="font-weight: bold;font-size:35px;">Subjects:</h2>
            <ul>{% for subject in course.subjects.all %}
            
                <li>{{subject.subject}}</li>
            {% endfor %}</ul>

            <div class="main-description">
            <p>{{course.description}}</p>

            
                 <img src="{{course.image.url}}" alt="courses-image" style="width: 200px;height: 150px;">     
            </div>
            </div>
    </div>
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
